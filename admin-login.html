<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Nyumbani Hub</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Merriweather:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Ubuntu', sans-serif;
        }

        body {
            background: #0b1c39;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            color: #333;
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .login-box h2 {
            color: #0b1c39;
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        .btn {
            width: 100%;
            background: #0b1c39;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ffd700;
            color: #000;
        }

        .error {
            color: red;
            margin-bottom: 15px;
            text-align: center;
            display: none;
        }

        .helper-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2 id="form-title">Admin Login</h2>
        <div class="error" id="error-msg"></div>

        <form id="auth-form">
            <div class="input-group" id="name-group" style="display:none;">
                <label>Full Name</label>
                <input type="text" id="fullname">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn" id="submit-btn">Login</button>
        </form>

        <div class="helper-text">
            Admin access only. Use your dashboard credentials to continue.
        </div>
    </div>

    <script>
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const res = await fetch('/api/auth/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                let data;
                const contentType = res.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    data = await res.json();
                } else {
                    data = { error: 'Invalid response from server. Check backend.' };
                }

                if (!res.ok) {
                    errorMsg.innerText = data.error || 'Authentication failed';
                    errorMsg.style.display = 'block';
                    return;
                }

                localStorage.setItem('adminToken', data.token);
                localStorage.setItem('adminUser', JSON.stringify(data.user));
                window.location.href = 'admin.html';
            } catch (err) {
                console.error('Fetch error:', err);
                errorMsg.innerText = err.message === 'Failed to fetch'
                    ? 'Cannot connect to server. Please ensure backend is running.'
                    : 'Server error. Please try again.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
