<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Agents | Nyumbani Hub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;font-family:Roboto,sans-serif;background:#f5f7fa;color:#18233a}header{background:#0b1c39;color:#fff;padding:20px 8%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:700;color:#ffd700}nav a{color:#fff;text-decoration:none;margin-left:22px}.hero{background:linear-gradient(#0b1c39cc,#0b1c39cc),url('https://images.unsplash.com/photo-1560520653-9e0e4c89eb11?q=80&w=1600&auto=format&fit=crop') center/cover;padding:80px 8%;text-align:center;color:white}.hero h1{font-size:44px;margin:0 0 12px}.wrap{max-width:1200px;margin:0 auto;padding:64px 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:24px}.card{background:#fff;border-radius:14px;padding:28px;text-align:center;box-shadow:0 5px 18px #0b1c3912}.card img,.placeholder{width:128px;height:128px;border-radius:50%;object-fit:cover;background:#dbe4ef;margin:0 auto 18px}.placeholder{display:grid;place-items:center;font-size:44px;color:#0b1c39}.role{color:#8b6b00;font-weight:700}.bio{color:#5d6675;line-height:1.55}.chips span{display:inline-block;background:#eef2f6;padding:5px 9px;border-radius:14px;font-size:12px;margin:3px}.buttons a{display:inline-block;margin:8px 4px;padding:10px 13px;background:#0b1c39;color:#fff;border-radius:7px;text-decoration:none;font-size:14px}footer{background:#09152c;color:#bbb;text-align:center;padding:30px}@media(max-width:720px){nav{display:none}.hero h1{font-size:34px}}
</style></head><body><header><div class="logo">Nyumbani Hub</div><nav><a href="index.html">Home</a><a href="rentals.html">Rentals</a><a href="property.html">Buy Property</a><a href="bnb.html">BnB</a><a href="agents.html">Agents</a></nav></header><section class="hero"><h1>Meet Our Property Team</h1><p>Local expertise for every move.</p></section><main class="wrap"><div id="agents" class="grid"><p>Loading our team...</p></div></main><footer>© 2026 Nyumbani Hub. Rent • Buy • Resell • Stay</footer><script>
const esc=v=>String(v||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
fetch('/api/agents').then(r=>r.json()).then(items=>{document.getElementById('agents').innerHTML=items.length?items.map(a=>{const wa=(a.whatsapp||a.phone||'').replace(/\D/g,'');return `<article class="card">${a.profile_photo?`<img src="${esc(a.profile_photo)}" alt="${esc(a.full_name)}">`:'<div class="placeholder">⌂</div>'}<h2>${esc(a.full_name)}</h2><p class="role">${esc(a.job_title||'Property Consultant')}</p><p class="bio">${esc(a.bio||'Ready to help you find your next home.')}</p><div class="chips">${String(a.specialties||'').split(',').filter(Boolean).map(x=>`<span>${esc(x.trim())}</span>`).join('')}</div><div class="buttons">${a.email?`<a href="mailto:${encodeURIComponent(a.email)}">Email</a>`:''}${wa?`<a href="https://wa.me/${wa}?text=${encodeURIComponent('Hello '+a.full_name+', I would like help finding a property.')}" target="_blank" rel="noopener">WhatsApp</a>`:''}</div></article>`}).join(''):'<p>No team members are available yet.</p>';}).catch(()=>document.getElementById('agents').innerHTML='<p>Our team directory is temporarily unavailable.</p>');
  <script src="mobile-nav.js"></script>
</script></body></html>
