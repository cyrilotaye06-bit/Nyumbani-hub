<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nyumbani Hub - Resales</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Roboto',sans-serif;
    }

    body{
      background:#f5f7fa;
      color:#222;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    header{
      background:#0b1c39;
      color:white;
      padding:20px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:1000;
    }

    .logo{
      font-size:28px;
      font-weight:700;
      color:#ffd700;
    }

    nav a{
      margin-left:25px;
      font-weight:500;
      transition:0.3s;
    }

    nav a:hover{
      color:#ffd700;
    }

    .hero{
      height:70vh;
      background:
      linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
      url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?q=80&w=1600&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:white;
      padding:20px;
    }

    .hero-content h1{
      font-size:48px;
      margin-bottom:15px;
    }

    .hero-content p{
      font-size:18px;
      margin-bottom:25px;
    }

    section{
      padding:80px 8%;
    }

    .section-title{
      text-align:center;
      margin-bottom:50px;
    }

    .section-title h2{
      font-size:36px;
      color:#0b1c39;
    }

    .properties{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:30px;
    }

    .property-card{
      background:white;
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 5px 15px rgba(0,0,0,0.08);
      transition:0.3s;
    }

    .property-card:hover{
      transform:translateY(-8px);
    }

    .property-card img{
      width:100%;
      height:240px;
      object-fit:cover;
    }

    .property-image-wrap {
      position: relative;
    }

    .property-image-wrap .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      display: inline-block;
      background: rgba(11, 28, 57, 0.9);
      color: white;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .filter-panel {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      margin-bottom: 24px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-group label {
      font-size: 13px;
      font-weight: 700;
      color: #0b1c39;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .filter-group input,
    .filter-group select {
      padding: 10px 12px;
      border: 1px solid #d8dde5;
      border-radius: 8px;
      font-size: 14px;
    }

    .property-info{
      padding:20px;
    }

    .property-info h3 {
      margin-bottom: 6px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .favorite-btn {
      border: none;
      background: #f3f4f6;
      color: #0b1c39;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .favorite-btn.active {
      background: #ffecec;
      color: #dc2626;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 14px;
      color: #475569;
      font-size: 13px;
    }

    .meta-chip {
      background: #f8fafc;
      padding: 6px 8px;
      border-radius: 999px;
    }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .compare-pill {
      font-size: 13px;
      color: #475569;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .property-info h3{
      margin-bottom:10px;
      color:#0b1c39;
    }

    .property-info p{
      color:#666;
      margin-bottom:10px;
      font-size:14px;
    }

    .price{
      color:#0b1c39;
      font-size:22px;
      font-weight:700;
      margin-bottom:15px;
    }

    .btn{
      display:inline-block;
      background:#0b1c39;
      color:white;
      padding:12px 20px;
      border-radius:8px;
      transition:0.3s;
    }

    .btn:hover{
      background:#ffd700;
      color:#000;
    }

    footer{
      background:#09152c;
      color:white;
      padding:40px 8%;
      text-align:center;
    }

    footer p{
      margin-top:10px;
      color:#bbb;
    }

    @media(max-width:768px){
      .hero-content h1{
        font-size:32px;
      }
      nav{
        display:none;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Nyumbani Hub</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="rentals.html">Rentals</a>
      <a href="property.html">Buy Property</a>
      <a href="bnb.html">BnB</a>
      <a href="resales.html">Resales</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Resale Properties</h1>
      <p>Find great deals on pre-owned homes and apartments.</p>
    </div>
  </section>

  <section>
    <div class="section-title">
      <h2>Recent Resales</h2>
    </div>

    <div class="filter-panel">
      <div class="filter-grid">
        <div class="filter-group">
          <label for="resale-keyword">Keyword</label>
          <input id="resale-keyword" type="text" placeholder="Location or amenity" />
        </div>
        <div class="filter-group">
          <label for="resale-bedrooms">Bedrooms</label>
          <select id="resale-bedrooms">
            <option value="">Any</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4+">4+</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="resale-min-price">Min Price</label>
          <input id="resale-min-price" type="number" min="0" placeholder="KES" />
        </div>
        <div class="filter-group">
          <label for="resale-max-price">Max Price</label>
          <input id="resale-max-price" type="number" min="0" placeholder="KES" />
        </div>
      </div>
    </div>

    <div class="properties" id="resales-properties"></div>
    <div id="compare-bar" style="display:none; position:sticky; bottom:18px; margin:24px auto 0; max-width:720px; padding:14px 18px; background:#0b1c39; color:white; border-radius:12px; text-align:center; box-shadow:0 10px 24px rgba(0,0,0,.2);"></div>
  </section>

  <script>
    const FAVORITES_STORAGE_KEY = 'nyumbaniHubFavorites';
    let allResaleProperties = [];
    let comparisonProperties = [];

    function getFavorites() {
      try { return JSON.parse(localStorage.getItem(FAVORITES_STORAGE_KEY) || '[]'); } catch (err) { return []; }
    }

    function saveFavorites(favorites) {
      localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(favorites));
    }

    function isFavorite(propertyId) {
      return getFavorites().some(item => item.id === propertyId);
    }

    function toggleFavorite(property) {
      const favorites = getFavorites();
      const exists = favorites.some(item => item.id === property.id);
      const nextFavorites = exists ? favorites.filter(item => item.id !== property.id) : [...favorites, { id: property.id, title: property.title, price: property.price, location: property.location, category: property.category, image_path: property.image_paths ? property.image_paths.split(',')[0] : '' }];
      saveFavorites(nextFavorites);
      renderResaleProperties();
    }

    function getImageUrl(imagePath) {
      if (!imagePath) return '/uploads/default.jpg';
      if (/^https?:\/\//i.test(imagePath) || imagePath.startsWith('data:')) return imagePath;
      if (imagePath.startsWith('/')) return imagePath;
      return `/uploads/${imagePath.replace(/^uploads\//, '')}`;
    }

    function filterResaleProperties(properties) {
      const keyword = document.getElementById('resale-keyword').value.trim().toLowerCase();
      const bedrooms = document.getElementById('resale-bedrooms').value;
      const minPrice = Number(document.getElementById('resale-min-price').value || 0);
      const maxPrice = Number(document.getElementById('resale-max-price').value || Number.MAX_SAFE_INTEGER);
      return properties.filter(property => {
        const searchableText = `${property.title || ''} ${property.location || ''} ${property.description || ''} ${property.amenities || ''}`.toLowerCase();
        const matchesKeyword = !keyword || searchableText.includes(keyword);
        const bedroomCount = Number(property.bedrooms) || 0;
        const matchesBedrooms = !bedrooms || (bedrooms === '4+' ? bedroomCount >= 4 : bedroomCount === Number(bedrooms));
        const price = Number(property.price) || 0;
        const matchesPrice = price >= minPrice && price <= maxPrice;
        return matchesKeyword && matchesBedrooms && matchesPrice;
      });
    }

    function updateComparisonBar() {
      const bar = document.getElementById('compare-bar');
      if (!comparisonProperties.length) { bar.style.display = 'none'; return; }
      bar.style.display = 'block';
      bar.innerHTML = `${comparisonProperties.length} selected for comparison <button onclick="showComparison()" style="margin-left:10px; padding:8px 12px; border:none; border-radius:8px; cursor:pointer;">Compare</button> <button onclick="clearComparison()" style="margin-left:6px; padding:8px 12px; border:none; border-radius:8px; cursor:pointer;">Clear</button>`;
    }

    function clearComparison() { comparisonProperties = []; document.querySelectorAll('.compare-checkbox').forEach(input => input.checked = false); updateComparisonBar(); }

    function showComparison() {
      if (comparisonProperties.length < 2) { alert('Select at least two properties to compare.'); return; }
      const rows = [['Price', p => `KES ${Number(p.price || 0).toLocaleString()}`], ['Location', p => p.location || '—'], ['Beds', p => p.bedrooms || '—'], ['Baths', p => p.bathrooms || '—'], ['Furnished', p => p.furnished || 'No'], ['Type', p => p.property_type || p.category || '—']];
      const popup = window.open('', 'property-comparison', 'width=900,height=650');
      popup.document.write(`<title>Nyumbani Hub Property Comparison</title><style>body{font-family:Arial;padding:28px;color:#0b1c39}table{border-collapse:collapse;width:100%}th,td{border:1px solid #dbe2ea;padding:12px;text-align:left}th{background:#0b1c39;color:white}</style><h1>Compare Properties</h1><table><tr><th>Feature</th>${comparisonProperties.map(p => `<th>${p.title}</th>`).join('')}</tr>${rows.map(([label, value]) => `<tr><td><strong>${label}</strong></td>${comparisonProperties.map(p => `<td>${value(p)}</td>`).join('')}</tr>`).join('')}</table>`);
      popup.document.close();
    }

    function toggleComparison(property) {
      const existing = comparisonProperties.findIndex(item => item.id === property.id);
      if (existing >= 0) comparisonProperties.splice(existing, 1);
      else if (comparisonProperties.length < 3) comparisonProperties.push(property);
      else { alert('You can compare up to three properties at a time.'); return; }
      updateComparisonBar();
    }

    function renderResaleProperties() {
      const container = document.getElementById('resales-properties');
      container.innerHTML = '<p style="grid-column: 1 / -1; text-align: center;">Loading Resales...</p>';
      const filteredProperties = filterResaleProperties(allResaleProperties);
      if (!filteredProperties.length) {
        container.innerHTML = '<p style="grid-column: 1 / -1; text-align: center;">No resale properties match your current filters.</p>';
        updateComparisonBar();
        return;
      }
      container.innerHTML = '';
      filteredProperties.forEach(property => {
        const imagePaths = property.image_paths ? property.image_paths.split(',') : [];
        const imageUrl = getImageUrl(imagePaths[0] || property.image_path);
        const favoriteActive = isFavorite(property.id) ? 'active' : '';
        container.innerHTML += `
          <div class="property-card">
            <div class="property-image-wrap">
              <img src="${imageUrl}" alt="${property.title}">
              <span class="badge">Resale</span>
            </div>
            <div class="property-info">
              <div class="card-top">
                <h3>${property.title}</h3>
                <button class="favorite-btn ${favoriteActive}" type="button" onclick="toggleFavorite(${JSON.stringify(property).replace(/'/g, '&#39;')})" aria-label="Save property"><i class="${favoriteActive ? 'fa-solid fa-heart' : 'fa-regular fa-heart'}"></i></button>
              </div>
              <p>${property.location}</p>
              <div class="price">KES ${Number(property.price || 0).toLocaleString()}</div>
              <div class="meta-row">
                <span class="meta-chip">${property.bedrooms || 0} Beds</span>
                <span class="meta-chip">${property.bathrooms || 0} Baths</span>
                <span class="meta-chip">${property.furnished || 'No'} Furnished</span>
              </div>
              <div class="card-actions">
                <a href="property-details.html?id=${property.id}" class="btn">View Details</a>
                <label class="compare-pill"><input class="compare-checkbox" type="checkbox" onchange="toggleComparison(${JSON.stringify(property).replace(/'/g, '&#39;')})"> Compare</label>
              </div>
            </div>
          </div>
        `;
      });
      updateComparisonBar();
    }

    async function loadResaleProperties() {
      try {
        const response = await fetch('/api/properties?category=Resale');
        if (!response.ok) throw new Error('Failed to fetch properties');
        allResaleProperties = await response.json();
        renderResaleProperties();
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('resales-properties').innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: red;">Error loading properties. Please try again later.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      ['resale-keyword', 'resale-bedrooms', 'resale-min-price', 'resale-max-price'].forEach(id => {
        document.getElementById(id).addEventListener('input', renderResaleProperties);
        document.getElementById(id).addEventListener('change', renderResaleProperties);
      });
      loadResaleProperties();
    });
  </script>

  <footer>
    <h2>Nyumbani Hub</h2>
    <p>Rent • Buy • Resell • Stay</p>
    <p>© 2026 Nyumbani Hub. All Rights Reserved.</p>
  </footer>

</body>
</html>
