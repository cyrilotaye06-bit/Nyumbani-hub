<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nyumbani Hub - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Raleway',sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(
rgba(0,0,0,.5),
rgba(0,0,0,.5)
),
url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?q=80&w=1600');
background-size:cover;
background-position:center;
}

.container{
width:100%;
max-width:450px;
padding:20px;
}

.login-card{

background:white;

padding:40px;

border-radius:20px;

box-shadow:
0 10px 30px rgba(0,0,0,.2);

}

.logo{

font-family:'Lora',serif;

font-size:34px;

font-weight:700;

text-align:center;

color:#0B1C39;

margin-bottom:10px;

}

.tagline{

text-align:center;

color:#666;

margin-bottom:30px;

}

.form-group{

margin-bottom:20px;

}

label{

display:block;

margin-bottom:8px;

font-weight:500;

}

input{

width:100%;

padding:14px;

border:1px solid #ddd;

border-radius:10px;

font-size:15px;

}

input:focus{

outline:none;

border-color:#0B1C39;

}

button{

width:100%;

padding:15px;

background:#0B1C39;

color:white;

border:none;

border-radius:10px;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#173a74;

}

.error{

background:#ffe5e5;

color:#d60000;

padding:10px;

border-radius:8px;

margin-bottom:15px;

display:none;

}

.success{

background:#e5ffe8;

color:#008a20;

padding:10px;

border-radius:8px;

margin-bottom:15px;

display:none;

}

.links{

margin-top:20px;

text-align:center;

}

.links a{

color:#0B1C39;

font-weight:600;

text-decoration:none;

}

.links a:hover{

text-decoration:underline;

}

.demo{

margin-top:20px;

background:#f5f5f5;

padding:15px;

border-radius:10px;

font-size:14px;

}

</style>

</head>

<body>

<div class="container">

<div class="login-card">

<div class="logo">
Nyumbani Hub
</div>

<p class="tagline">
Access Rentals, Property Purchases, BnB Bookings & Resales
</p>

<div id="errorBox" class="error"></div>

<div id="successBox" class="success"></div>

<form id="loginForm">

<div class="form-group">

<label>Email Address</label>

<input
type="email"
id="email"
required>

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
id="password"
required>

</div>

<button type="submit">

Login

</button>

</form>

<div class="links">

<p>

Don't have an account?

<a href="register.html">

Create Account

</a>

</p>

</div>

<div class="demo">

<strong>Demo Account</strong>

<br><br>

Email:
admin@nyumbanihub.com

<br>

Password:
admin123

</div>

</div>

</div>

<script>

// ============================
// LOGIN SYSTEM
// ============================

const API_URL = "http://localhost:3000/api";

const loginForm =
document.getElementById(
"loginForm"
);

function showMessage(message, isError = false) {
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  errorBox.style.display = 'none';
  successBox.style.display = 'none';
  if (isError) {
    errorBox.innerHTML = message;
    errorBox.style.display = 'block';
  } else {
    successBox.innerHTML = message;
    successBox.style.display = 'block';
  }
}

loginForm.addEventListener(
"submit",
async function(e){

e.preventDefault();

const email =
document.getElementById(
"email"
).value;

const password =
document.getElementById(
"password"
).value;

const errorBox =
document.getElementById(
"errorBox"
);

const successBox =
document.getElementById(
"successBox"
);

errorBox.style.display =
"none";

successBox.style.display =
"none";

try{

const response =
await fetch(

`${API_URL}/auth/user/login`,

{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email,
password

})

}

);

const data =
await response.json();

if(response.ok){

localStorage.setItem(

"userToken",

data.token

);

localStorage.setItem(

"userAccount",

JSON.stringify(data.user)

);

showMessage("Login Successful...");

setTimeout(()=>{

window.location.href =
"index.html";

},1500);

}

else{

showMessage(data.error || "Invalid Credentials", true);

}

}

catch(error){

showMessage("Unable to connect to server", true);

console.error(error);

}

});

// ============================
// AUTO REDIRECT
// ============================

const currentUser =
localStorage.getItem(
"userToken"
);

if(currentUser){

window.location.href =
"index.html";

}

</script>

<script>
  window.location.replace('index.html');
</script>
</body>
</html>
